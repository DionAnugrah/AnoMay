<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnoMay — Testing Panel</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f1f5f9; color: #1e293b; }
  header { background: #1e293b; color: white; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 18px; font-weight: 600; }
  #user-info { font-size: 13px; color: #94a3b8; }
  #logout-btn { background: #ef4444; color: white; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; display: none; }

  .layout { display: flex; min-height: calc(100vh - 50px); }
  nav { width: 220px; background: #fff; border-right: 1px solid #e2e8f0; padding: 16px 0; flex-shrink: 0; }
  nav .nav-section { font-size: 11px; font-weight: 600; color: #94a3b8; text-transform: uppercase; padding: 8px 16px 4px; }
  nav button { display: block; width: 100%; text-align: left; padding: 8px 16px; border: none; background: none; cursor: pointer; font-size: 14px; color: #475569; border-left: 3px solid transparent; }
  nav button:hover { background: #f8fafc; color: #1e293b; }
  nav button.active { background: #eff6ff; color: #2563eb; border-left-color: #2563eb; font-weight: 500; }

  main { flex: 1; padding: 24px; overflow-y: auto; }
  .panel { display: none; }
  .panel.active { display: block; }

  h2 { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
  .card { background: white; border-radius: 10px; padding: 20px; margin-bottom: 16px; border: 1px solid #e2e8f0; }

  label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 4px; color: #475569; }
  input, select { width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; margin-bottom: 12px; }
  input:focus, select:focus { outline: none; border-color: #2563eb; }

  .btn { padding: 8px 18px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; }
  .btn-primary { background: #2563eb; color: white; }
  .btn-primary:hover { background: #1d4ed8; }
  .btn-danger { background: #ef4444; color: white; }
  .btn-success { background: #16a34a; color: white; }
  .btn-sm { padding: 4px 10px; font-size: 12px; }

  .response-box { background: #0f172a; color: #e2e8f0; padding: 14px; border-radius: 8px; font-size: 13px; font-family: monospace; white-space: pre-wrap; max-height: 300px; overflow-y: auto; margin-top: 12px; }
  .response-box.ok { border-left: 4px solid #22c55e; }
  .response-box.err { border-left: 4px solid #ef4444; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { background: #f8fafc; text-align: left; padding: 8px 12px; border-bottom: 2px solid #e2e8f0; font-weight: 600; color: #475569; }
  td { padding: 8px 12px; border-bottom: 1px solid #f1f5f9; }
  tr:hover td { background: #f8fafc; }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 600; }
  .badge-pending { background: #fef3c7; color: #92400e; }
  .badge-accepted { background: #dcfce7; color: #166534; }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 700px) { .grid-2 { grid-template-columns: 1fr; } nav { display: none; } }

  #login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #f1f5f9; }
  .login-card { background: white; padding: 36px; border-radius: 12px; width: 360px; border: 1px solid #e2e8f0; box-shadow: 0 4px 24px #0001; }
  .login-card h2 { text-align: center; margin-bottom: 24px; font-size: 22px; }
  .login-card .logo { text-align: center; font-size: 32px; margin-bottom: 8px; }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen">
  <div class="login-card">
    <div class="logo">🥟</div>
    <h2>AnoMay Testing Panel</h2>
    <label>Username</label>
    <input type="text" id="login-username" placeholder="admin / boss / penjual">
    <label>Password</label>
    <input type="password" id="login-password" placeholder="password">
    <button class="btn btn-primary" style="width:100%;margin-top:4px" onclick="doLogin()">Login</button>
    <div id="login-error" style="color:#ef4444;font-size:13px;margin-top:10px;text-align:center"></div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app" style="display:none">
  <header>
    <h1>🥟 AnoMay — Testing Panel</h1>
    <div style="display:flex;align-items:center;gap:12px">
      <span id="user-info"></span>
      <button id="logout-btn" onclick="doLogout()">Logout</button>
    </div>
  </header>
  <div class="layout">
    <nav id="sidebar"></nav>
    <main id="main-content"></main>
  </div>
</div>

<script>
// ─── STATE ───────────────────────────────────────────────────────────────────
let currentUser = null;

// Ambil tanggal hari ini sesuai timezone lokal (bukan UTC)
function today() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// ─── HELPERS ─────────────────────────────────────────────────────────────────
async function api(method, url, body = null) {
  const opts = { method, headers: { 'Content-Type': 'application/json', 'Accept': 'application/json', 'X-Requested-With': 'XMLHttpRequest' }, credentials: 'include' };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(url, opts);
  const data = await res.json().catch(() => ({}));
  return { ok: res.ok, status: res.status, data };
}

function showResponse(boxId, result) {
  const el = document.getElementById(boxId);
  if (!el) return;
  el.className = 'response-box ' + (result.ok ? 'ok' : 'err');
  el.textContent = JSON.stringify(result.data, null, 2);
}

function renderPanel(id) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  const panel = document.getElementById(id);
  if (panel) panel.classList.add('active');
  const btn = document.querySelector(`nav button[data-panel="${id}"]`);
  if (btn) btn.classList.add('active');
  if (id === 'panel-stock') populateStockDropdowns();
  if (id === 'panel-laporan-admin') populateLaporanFilter();
  if (id === 'panel-lapor') { populateLaporDropdown(); setTimeout(() => loadStokHariIni(today()), 50); }
}

// ─── AUTH ─────────────────────────────────────────────────────────────────────
async function doLogin() {
  const username = document.getElementById('login-username').value;
  const password = document.getElementById('login-password').value;
  const r = await api('POST', '/login', { username, password });
  if (r.ok) {
    currentUser = r.data.user;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('user-info').textContent = `${currentUser.name} (${currentUser.role})`;
    document.getElementById('logout-btn').style.display = 'inline-block';
    buildUI();
  } else {
    document.getElementById('login-error').textContent = r.data.message || 'Login gagal';
  }
}

async function doLogout() {
  await api('POST', '/logout');
  location.reload();
}

// ─── BUILD UI BY ROLE ─────────────────────────────────────────────────────────
function buildUI() {
  const role = currentUser.role;
  const sidebar = document.getElementById('sidebar');
  const main = document.getElementById('main-content');

  const menus = {
    admin: [
      { section: 'Admin' },
      { label: '👥 Kelola Penjual', panel: 'panel-users' },
      { label: '📦 Kelola Produk', panel: 'panel-products' },
      { label: '🌅 Alokasi Stok', panel: 'panel-stock' },
      { label: '📋 Laporan Jualan', panel: 'panel-laporan-admin' },
    ],
    boss: [
      { section: 'Boss' },
      { label: '📋 Semua Laporan', panel: 'panel-laporan-admin' },
    ],
    penjual: [
      { section: 'Penjual' },
      { label: '📝 Lapor Jualan', panel: 'panel-lapor' },
      { label: '📜 Riwayat Jualan', panel: 'panel-riwayat' },
    ],
  };

  // Build sidebar
  sidebar.innerHTML = (menus[role] || []).map(m =>
    m.section
      ? `<div class="nav-section">${m.section}</div>`
      : `<button data-panel="${m.panel}" onclick="renderPanel('${m.panel}')">${m.label}</button>`
  ).join('');

  // Build panels
  main.innerHTML = buildPanels(role);

  // Show first panel
  const first = (menus[role] || []).find(m => m.panel);
  if (first) renderPanel(first.panel);
}

function buildPanels(role) {
  let html = '';

  if (role === 'admin') {
    html += panelUsers() + panelProducts() + panelStock() + panelLaporanAdmin();
  } else if (role === 'boss') {
    html += panelLaporanAdmin();
  } else if (role === 'penjual') {
    html += panelLapor() + panelRiwayat();
  }

  return html;
}

// ─── PANEL: USERS ─────────────────────────────────────────────────────────────
function panelUsers() {
  return `
  <div class="panel" id="panel-users">
    <h2>👥 Kelola Penjual</h2>
    <div class="grid-2">
      <div class="card">
        <h3 style="margin-bottom:12px;font-size:15px">Tambah User</h3>
        <label>Nama</label><input id="u-name" placeholder="Nama lengkap">
        <label>Username</label><input id="u-username" placeholder="username">
        <label>Password</label><input id="u-password" type="password" placeholder="min 8 karakter">
        <label>Role</label>
        <select id="u-role">
          <option value="penjual">Penjual</option>
          <option value="admin">Admin</option>
          <option value="boss">Boss</option>
        </select>
        <button class="btn btn-primary" onclick="storeUser()">Simpan</button>
        <div id="res-user-store" class="response-box" style="display:none"></div>
      </div>
      <div class="card">
        <h3 style="margin-bottom:12px;font-size:15px">Daftar User</h3>
        <button class="btn btn-primary btn-sm" onclick="loadUsers()" style="margin-bottom:12px">🔄 Refresh</button>
        <div id="users-table">Klik Refresh untuk memuat data.</div>
      </div>
    </div>
  </div>`;
}

async function storeUser() {
  const r = await api('POST', '/admin/users', {
    name: document.getElementById('u-name').value,
    username: document.getElementById('u-username').value,
    password: document.getElementById('u-password').value,
    role: document.getElementById('u-role').value,
  });
  const box = document.getElementById('res-user-store');
  box.style.display = 'block';
  showResponse('res-user-store', r);
  if (r.ok) loadUsers();
}

async function loadUsers() {
  const r = await api('GET', '/admin/users');
  const el = document.getElementById('users-table');
  if (!r.ok) { el.innerHTML = `<p style="color:red">${r.data.message}</p>`; return; }
  const rows = r.data.data.map(u => `
    <tr>
      <td>${u.id}</td><td>${u.name}</td><td>${u.username}</td><td>${u.role}</td>
      <td><button class="btn btn-danger btn-sm" onclick="deleteUser(${u.id})">Hapus</button></td>
    </tr>`).join('');
  el.innerHTML = `<table><thead><tr><th>ID</th><th>Nama</th><th>Username</th><th>Role</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
}

async function deleteUser(id) {
  if (!confirm('Hapus user ini?')) return;
  const r = await api('DELETE', `/admin/users/${id}`);
  alert(r.data.message);
  loadUsers();
}

// ─── PANEL: PRODUCTS ──────────────────────────────────────────────────────────
function panelProducts() {
  return `
  <div class="panel" id="panel-products">
    <h2>📦 Kelola Produk</h2>
    <div class="grid-2">
      <div class="card">
        <h3 style="margin-bottom:12px;font-size:15px">Tambah Produk</h3>
        <label>Nama Produk</label><input id="p-name" placeholder="cth: Somay Campur">
        <label>Harga (Rp)</label><input id="p-price" type="number" placeholder="cth: 2000">
        <button class="btn btn-primary" onclick="storeProduct()">Simpan</button>
        <div id="res-product-store" class="response-box" style="display:none"></div>
      </div>
      <div class="card">
        <h3 style="margin-bottom:12px;font-size:15px">Daftar Produk</h3>
        <button class="btn btn-primary btn-sm" onclick="loadProducts()" style="margin-bottom:12px">🔄 Refresh</button>
        <div id="products-table">Klik Refresh untuk memuat data.</div>
      </div>
    </div>
  </div>`;
}

async function storeProduct() {
  const r = await api('POST', '/admin/products', {
    name: document.getElementById('p-name').value,
    price: parseInt(document.getElementById('p-price').value),
  });
  const box = document.getElementById('res-product-store');
  box.style.display = 'block';
  showResponse('res-product-store', r);
  if (r.ok) loadProducts();
}

async function loadProducts() {
  const r = await api('GET', '/admin/products');
  const el = document.getElementById('products-table');
  if (!r.ok) { el.innerHTML = `<p style="color:red">${r.data.message}</p>`; return; }
  const rows = r.data.data.map(p => `
    <tr>
      <td>${p.id}</td><td>${p.name}</td><td>Rp ${Number(p.price).toLocaleString('id')}</td>
      <td><button class="btn btn-danger btn-sm" onclick="deleteProduct(${p.id})">Hapus</button></td>
    </tr>`).join('');
  el.innerHTML = `<table><thead><tr><th>ID</th><th>Nama</th><th>Harga</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
}

async function deleteProduct(id) {
  if (!confirm('Hapus produk ini?')) return;
  const r = await api('DELETE', `/admin/products/${id}`);
  alert(r.data.message);
  loadProducts();
}

// ─── PANEL: STOCK ALLOCATION ──────────────────────────────────────────────────
function panelStock() {
  return `
  <div class="panel" id="panel-stock">
    <h2>🌅 Alokasi Stok Pagi</h2>
    <div class="grid-2">
      <div class="card">
        <h3 style="margin-bottom:12px;font-size:15px">Beri Alokasi Stok</h3>
        <label>Penjual</label>
        <select id="s-user"><option value="">— Pilih Penjual —</option></select>
        <label>Produk</label>
        <select id="s-product"><option value="">— Pilih Produk —</option></select>
        <label>Tanggal</label><input id="s-date" type="date" value="${today()}">
        <label>Jumlah Stok (qty)</label><input id="s-qty" type="number" placeholder="cth: 100">
        <button class="btn btn-primary" onclick="storeStock()">Simpan Alokasi</button>
        <div id="res-stock-store" class="response-box" style="display:none"></div>
      </div>
      <div class="card">
        <h3 style="margin-bottom:12px;font-size:15px">Lihat Alokasi</h3>
        <label>Filter Tanggal</label><input id="s-filter-date" type="date" value="${today()}">
        <button class="btn btn-primary btn-sm" onclick="loadStock()" style="margin-bottom:12px">🔄 Tampilkan</button>
        <div id="stock-table">Klik Tampilkan untuk memuat data.</div>
      </div>
    </div>
  </div>`;
}

async function populateStockDropdowns() {
  const selUser = document.getElementById('s-user');
  const selProduct = document.getElementById('s-product');
  if (!selUser || !selProduct || selUser.options.length > 1) return;

  const [rUsers, rProducts] = await Promise.all([
    api('GET', '/admin/users'),
    api('GET', '/admin/products'),
  ]);

  if (rUsers.ok) {
    rUsers.data.data.forEach(u => {
      const opt = document.createElement('option');
      opt.value = u.id;
      opt.textContent = `${u.name} (${u.username})`;
      selUser.appendChild(opt);
    });
  }

  if (rProducts.ok) {
    rProducts.data.data.forEach(p => {
      const opt = document.createElement('option');
      opt.value = p.id;
      opt.textContent = `${p.name} — Rp ${Number(p.price).toLocaleString('id')}`;
      selProduct.appendChild(opt);
    });
  }
}

async function storeStock() {
  const userId = document.getElementById('s-user').value;
  const productId = document.getElementById('s-product').value;
  if (!userId || !productId) { alert('Pilih penjual dan produk terlebih dahulu.'); return; }
  const r = await api('POST', '/admin/stock-allocations', {
    user_id: parseInt(userId),
    product_id: parseInt(productId),
    date: document.getElementById('s-date').value,
    qty_given: parseInt(document.getElementById('s-qty').value),
  });
  const box = document.getElementById('res-stock-store');
  box.style.display = 'block';
  showResponse('res-stock-store', r);
  if (r.ok) loadStock();
}

async function loadStock() {
  const date = document.getElementById('s-filter-date').value;
  const r = await api('GET', `/admin/stock-allocations?date=${date}`);
  const el = document.getElementById('stock-table');
  if (!r.ok) { el.innerHTML = `<p style="color:red">${r.data.message}</p>`; return; }
  if (!r.data.data.length) { el.innerHTML = '<p style="color:#94a3b8">Tidak ada data.</p>'; return; }
  const rows = r.data.data.map(s => `
    <tr>
      <td>${s.id}</td>
      <td>${s.user?.name ?? s.user_id}</td>
      <td>${s.product?.name ?? s.product_id}</td>
      <td>${s.date}</td>
      <td>${s.qty_given}</td>
      <td><button class="btn btn-danger btn-sm" onclick="deleteStock(${s.id})">Hapus</button></td>
    </tr>`).join('');
  el.innerHTML = `<table><thead><tr><th>ID</th><th>Penjual</th><th>Produk</th><th>Tanggal</th><th>Qty</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
}

async function deleteStock(id) {
  if (!confirm('Hapus alokasi ini?')) return;
  const r = await api('DELETE', `/admin/stock-allocations/${id}`);
  alert(r.data.message);
  loadStock();
}

// ─── PANEL: LAPORAN ADMIN ─────────────────────────────────────────────────────
function panelLaporanAdmin() {
  return `
  <div class="panel" id="panel-laporan-admin">
    <h2>📋 Laporan Jualan</h2>
    <div class="card" style="margin-bottom:12px;display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap">
      <div><label>Filter Tanggal</label><input id="l-filter-date" type="date" value="${today()}" style="margin:0;width:160px"></div>
      <div><label>Filter Penjual</label>
        <select id="l-filter-user" style="margin:0;width:180px">
          <option value="">Semua Penjual</option>
        </select>
      </div>
      <div><label>Filter Status</label>
        <select id="l-filter-status" style="margin:0;width:140px">
          <option value="">Semua</option>
          <option value="pending">Pending</option>
          <option value="accepted">Accepted</option>
        </select>
      </div>
      <button class="btn btn-primary btn-sm" onclick="loadLaporan()">🔄 Tampilkan</button>
    </div>
    <div class="card">
      <div id="laporan-table">Klik Tampilkan untuk memuat data.</div>
    </div>
  </div>`;
}

async function populateLaporanFilter() {
  const sel = document.getElementById('l-filter-user');
  if (!sel || sel.options.length > 1) return;
  const r = await api('GET', '/admin/users');
  if (r.ok) {
    r.data.data.forEach(u => {
      const opt = document.createElement('option');
      opt.value = u.id;
      opt.textContent = u.name;
      sel.appendChild(opt);
    });
  }
}

async function loadLaporan() {
  const date   = document.getElementById('l-filter-date').value;
  const status = document.getElementById('l-filter-status').value;
  const userId = document.getElementById('l-filter-user').value;
  let url = `/admin/laporan?date=${date}`;
  if (status) url += `&status=${status}`;
  if (userId) url += `&user_id=${userId}`;
  const r = await api('GET', url);
  const el = document.getElementById('laporan-table');
  if (!r.ok) { el.innerHTML = `<p style="color:red">${r.data.message}</p>`; return; }
  if (!r.data.length) { el.innerHTML = '<p style="color:#94a3b8">Tidak ada laporan.</p>'; return; }
  const rows = r.data.map(l => `
    <tr>
      <td>${l.id}</td>
      <td>${l.user?.name ?? l.user_id}</td>
      <td>${l.date}</td>
      <td>${l.qty_sold}</td>
      <td>${l.qty_returned}</td>
      <td>Rp ${Number(l.total_deposit).toLocaleString('id')}</td>
      <td><span class="badge badge-${l.status}">${l.status}</span></td>
      <td>
        ${l.status === 'pending'
          ? `<button class="btn btn-success btn-sm" onclick="acceptLaporan(${l.id})">✓ Terima</button>`
          : ''}
        <button class="btn btn-danger btn-sm" onclick="deleteLaporan(${l.id})" style="margin-left:4px">Hapus</button>
      </td>
    </tr>`).join('');
  el.innerHTML = `<table><thead><tr><th>ID</th><th>Penjual</th><th>Tanggal</th><th>Terjual</th><th>Sisa</th><th>Setoran</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
}

async function acceptLaporan(id) {
  const r = await api('PATCH', `/admin/laporan/${id}/status`, { status: 'accepted' });
  alert(r.data.message);
  loadLaporan();
}

async function deleteLaporan(id) {
  if (!confirm('Hapus laporan ini?')) return;
  const r = await api('DELETE', `/admin/laporan/${id}`);
  alert(r.data.message);
  loadLaporan();
}

// ─── PANEL: LAPOR JUALAN (PENJUAL) ────────────────────────────────────────────
function panelLapor() {
  return `
  <div class="panel" id="panel-lapor">
    <h2>📝 Lapor Jualan</h2>
    <div class="card" style="max-width:560px">
      <label>Pilih Tanggal</label>
      <input id="lj-date" type="date" value="${today()}" onchange="loadStokHariIni()">
      <div id="lj-stok-list" style="margin-top:4px"></div>
    </div>
  </div>`;
}

async function loadStokHariIni(tgl = null) {
  const dateEl = document.getElementById('lj-date');
  const date = tgl || (dateEl ? dateEl.value : today());
  const container = document.getElementById('lj-stok-list');
  if (!container) return;
  container.innerHTML = '<p style="color:#94a3b8;font-size:13px">Memuat...</p>';

  const r = await api('GET', `/penjual/my-stock?date=${date}`);
  console.log('[my-stock]', date, r.status, r.data);

  if (!r.ok) {
    container.innerHTML = `<p style="color:red">Error ${r.status}: ${r.data.message ?? JSON.stringify(r.data)}</p>`;
    return;
  }
  if (!r.data.data || !r.data.data.length) {
    container.innerHTML = `<p style="color:#94a3b8;font-size:13px">Tidak ada stok untuk tanggal <strong>${date}</strong>.</p>`;
    return;
  }

  container.innerHTML = r.data.data.map(s => `
    <div class="card" style="margin-bottom:12px;border:1px solid #e2e8f0" id="stok-card-${s.id}">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <span style="font-weight:600;font-size:15px">${s.product.name}</span>
        <span style="font-size:13px;color:#64748b">Stok dibawa: <strong>${s.qty_given}</strong></span>
      </div>
      <label>Jumlah Terjual</label>
      <input type="number" id="qty-${s.id}" min="0" max="${s.qty_given}" placeholder="0 – ${s.qty_given}">
      <div style="display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#64748b;margin-top:-8px;margin-bottom:10px">
        <span>Harga satuan: Rp ${Number(s.product.price).toLocaleString('id')}</span>
        <span id="preview-${s.id}"></span>
      </div>
      <button class="btn btn-primary btn-sm" onclick="submitSatuLaporan(${s.id})">Kirim Laporan Produk Ini</button>
      <div id="res-lapor-${s.id}" class="response-box" style="display:none;margin-top:8px"></div>
    </div>
  `).join('');

  // Preview kalkulasi realtime
  r.data.data.forEach(s => {
    const input = document.getElementById(`qty-${s.id}`);
    const preview = document.getElementById(`preview-${s.id}`);
    if (input && preview) {
      input.addEventListener('input', () => {
        const qty = parseInt(input.value) || 0;
        const sisa = s.qty_given - qty;
        const setoran = qty * s.product.price;
        preview.textContent = `Sisa: ${sisa} | Setoran: Rp ${setoran.toLocaleString('id')}`;
      });
    }
  });
}

async function submitSatuLaporan(allocId) {
  const qtyInput = document.getElementById(`qty-${allocId}`);
  const qty = parseInt(qtyInput?.value);
  if (isNaN(qty) || qty < 0) { alert('Isi jumlah terjual terlebih dahulu.'); return; }

  const r = await api('POST', '/penjual/lapor-jualan', {
    stock_allocation_id: allocId,
    qty_sold: qty,
  });

  const box = document.getElementById(`res-lapor-${allocId}`);
  box.style.display = 'block';
  box.className = 'response-box ' + (r.ok ? 'ok' : 'err');
  box.textContent = r.ok
    ? `✓ ${r.data.message}\nTerjual: ${r.data.qty_sold} | Sisa: ${r.data.qty_returned} | Setoran: ${r.data.total_deposit}`
    : r.data.message;

  if (r.ok) {
    // Disable form produk ini setelah berhasil lapor
    qtyInput.disabled = true;
    const btn = document.querySelector(`#stok-card-${allocId} button`);
    if (btn) { btn.disabled = true; btn.textContent = '✓ Sudah Dilaporkan'; btn.style.background = '#94a3b8'; }
  }
}

// ─── PANEL: RIWAYAT (PENJUAL) ─────────────────────────────────────────────────
function panelRiwayat() {
  return `
  <div class="panel" id="panel-riwayat">
    <h2>📜 Riwayat Jualan Saya</h2>
    <div class="card">
      <button class="btn btn-primary btn-sm" onclick="loadRiwayat()" style="margin-bottom:12px">🔄 Refresh</button>
      <div id="riwayat-table">Klik Refresh untuk memuat data.</div>
    </div>
  </div>`;
}

async function loadRiwayat() {
  const r = await api('GET', '/penjual/riwayat-jualan');
  const el = document.getElementById('riwayat-table');
  if (!r.ok) { el.innerHTML = `<p style="color:red">${r.data.message}</p>`; return; }
  if (!r.data.length) { el.innerHTML = '<p style="color:#94a3b8">Belum ada laporan.</p>'; return; }
  const rows = r.data.map(l => `
    <tr>
      <td>${l.date}</td>
      <td>${l.qty_sold}</td>
      <td>${l.qty_returned}</td>
      <td>Rp ${Number(l.total_deposit).toLocaleString('id')}</td>
      <td><span class="badge badge-${l.status}">${l.status}</span></td>
    </tr>`).join('');
  el.innerHTML = `<table><thead><tr><th>Tanggal</th><th>Terjual</th><th>Sisa</th><th>Setoran</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table>`;
}
